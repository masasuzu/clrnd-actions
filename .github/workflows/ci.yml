name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push cancels the older run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # The clrnd version the tests install. It must be a release with an attestation (v0.3.0 or later).
  CLRND_TEST_VERSION: 0.5.1

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner image ships shellcheck, but its version cannot be pinned. Install a pinned release
      # with its hash checked. actionlint also uses this one from PATH to check run: blocks.
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSLo shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.xz "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f "$archive" actionlint

      - name: Check the shell scripts
        run: |
          # bash -n only checks the first file (the rest become positional arguments), so run it
          # on each script separately.
          for script in lib/*.sh; do
            bash -n "$script"
          done
          shellcheck lib/*.sh

      # actionlint only looks at .github/workflows, not at action metadata. Mistakes in action.yml
      # are caught by the setup jobs below, which actually run it through uses:.
      - name: actionlint
        run: actionlint -color

  setup:
    name: setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clrnd
        id: install
        uses: ./setup
        with:
          version: ${{ env.CLRND_TEST_VERSION }}

      - name: clrnd is on PATH and is the requested version
        env:
          OUTPUT_VERSION: ${{ steps.install.outputs.version }}
          OUTPUT_PATH: ${{ steps.install.outputs.path }}
        run: |
          test "$OUTPUT_VERSION" = "$CLRND_TEST_VERSION"
          test "$(clrnd --version)" = "clrnd version ${CLRND_TEST_VERSION}"
          test "$("$OUTPUT_PATH" --version)" = "clrnd version ${CLRND_TEST_VERSION}"

      # A second run in the same job goes through the tool cache.
      - name: Install clrnd again (cached)
        uses: ./setup
        with:
          version: v${{ env.CLRND_TEST_VERSION }}

  setup-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The path that does not use gh. It uses a version no other step in this job installs: a tool
      # cache hit skips the download and every check, and the step would pass without taking this path.
      - name: verify-attestation false
        id: no-verify
        uses: ./setup
        with:
          version: 0.4.0
          verify-attestation: "false"

      - name: verify-attestation false installs the requested version
        env:
          INSTALLED: ${{ steps.no-verify.outputs.version }}
        run: |
          test "$INSTALLED" = 0.4.0
          test "$(clrnd --version)" = "clrnd version 0.4.0"

      - name: latest
        id: latest
        uses: ./setup
        with:
          version: latest

      - name: latest resolves to a version
        env:
          RESOLVED: ${{ steps.latest.outputs.version }}
        run: |
          [[ "$RESOLVED" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]
          test "$(clrnd --version)" = "clrnd version ${RESOLVED}"

      # A release with neither an attestation nor --version is refused, even with verify-attestation: false.
      - name: A release before v0.3.0 is refused
        id: unsupported
        continue-on-error: true
        uses: ./setup
        with:
          version: 0.2.0
          verify-attestation: "false"

      - name: A version that does not exist fails
        id: missing
        continue-on-error: true
        uses: ./setup
        with:
          version: 99.0.0

      - name: A malformed version fails
        id: malformed
        continue-on-error: true
        uses: ./setup
        with:
          version: main

      - name: The refused cases failed
        env:
          UNSUPPORTED: ${{ steps.unsupported.outcome }}
          MISSING: ${{ steps.missing.outcome }}
          MALFORMED: ${{ steps.malformed.outcome }}
        run: |
          test "$UNSUPPORTED" = failure
          test "$MISSING" = failure
          test "$MALFORMED" = failure
